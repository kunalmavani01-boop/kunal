
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kunal Mavani | Visual Alchemist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-noir: #050505;
            --accent-glow: rgba(99, 102, 241, 0.15);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-noir);
            color: #E2E8F0;
            scroll-behavior: smooth;
        }
        .serif-noir {
            font-family: 'Cormorant Garamond', serif;
        }
        .glass-noir {
            background: rgba(20, 20, 22, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glow-hover:hover {
            box-shadow: 0 0 40px var(--accent-glow);
        }

        /* Enhanced CRT Scanline Effect */
        .scanline-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
            opacity: 0.2;
        }
        /* Static horizontal lines */
        .scanline-static {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
        }
        /* Moving glow bar */
        .scanline-moving {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .scanline-moving::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(99, 102, 241, 0.08) 50%,
                transparent 100%
            );
            animation: scanline-animate 12s linear infinite;
        }
        
        @keyframes scanline-animate {
            0% { transform: translateY(-120px); }
            100% { transform: translateY(100vh); }
        }

        @media print {
            @page { 
                margin: 0.5cm; 
                size: A4;
            }
            body { 
                background-color: white !important; 
                color: black !important; 
                -webkit-print-color-adjust: exact !important; 
                print-color-adjust: exact !important;
            }
            .no-print { display: none !important; }
            
            /* Visual Alchemist Print Style */
            .glass-noir {
                background: white !important;
                border: 1px solid #eee !important;
                box-shadow: none !important;
                color: black !important;
            }
            
            /* Force images to show */
            img { 
                opacity: 1 !important; 
                filter: none !important; 
                display: block !important; 
            }
            
            /* Typography Resets for Print */
            h1, h2, h3, h4, h5, h6 { color: black !important; }
            p { color: #333 !important; }
            .text-indigo-500, .text-indigo-400 { color: #4338ca !important; } /* Indigo-700 for better contrast */
            .text-slate-200, .text-slate-300, .text-slate-400, .text-slate-500 { color: #444 !important; }
            
            /* Layout adjustments */
            .grid { display: grid !important; }
            .lg\:grid-cols-2 { grid-template-columns: 1fr 1fr !important; gap: 2rem !important; }
            
            /* Hero adjustments for print */
            .h-\[85vh\] { 
                height: auto !important; 
                min-height: 300px !important;
                padding-bottom: 2rem !important;
                border-bottom: 2px solid #000 !important;
                margin-bottom: 2rem !important;
            }
            /* Make the background image in Hero a faint watermark or visible header */
            .absolute.inset-0.z-0 img {
                opacity: 0.1 !important;
                position: absolute !important;
            }
            
            /* Footer cleanup */
            footer { 
                background: white !important; 
                color: black !important; 
                border-top: 2px solid black !important;
            }

            /* Links */
            a { text-decoration: none !important; color: #000 !important; }
        }
    </style>
    <script type="importmap">
    {
      "imports": {
        "lucide-react": "https://esm.sh/lucide-react@^0.475.0",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "docx": "https://esm.sh/docx@^9.1.0",
        "file-saver": "https://esm.sh/file-saver@^2.0.5"
      }
    }
    </script>
</head>
<body class="selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
</body>
</html>
